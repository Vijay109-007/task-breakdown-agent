 cobblestone streets, and the stunning Wernigerode Castle overlooking the town, you'll feel like you're living in a fairy tale — while enjoying all the conveniences of modern student life.",castleHead:"Wernigerode Castle",castleBody:"The iconic castle sits majestically on a hill above the town. Originally a medieval fortress, it's now a museum showcasing German aristocratic culture. A must-visit for every resident!",harzHead:"Harz National Park",harzBody:"Just minutes away, the Harz offers hiking, mountain biking, and winter sports. The Brocken, the highest peak in Northern Germany, is perfect for weekend adventures.",studentHead:"Student Life in Wernigerode",studentBody1:"Hochschule Harz — The university offers programs in business, automation, tourism, and more. Modern facilities combined with small class sizes create an ideal learning environment.",studentBody2:"Vibrant Town Center — The historic Marktplatz is surrounded by colorful half-timbered houses, cafés, and restaurants. Perfect for socializing between lectures.",studentBody3:"Cultural Events — Throughout the year, Wernigerode hosts medieval festivals, Christmas markets, and student gatherings that bring the community together.",thingsHead:"Things to Do",thingsList:["Ride the historic Harzer Schmalspurbahn steam railway","Explore medieval architecture in the Old Town","Hike to the Brocken summit for breathtaking views","Visit local breweries and traditional German restaurants","Ski and snowboard in winter at nearby resorts","Cycle through picturesque Harz villages","Attend summer festivals and open-air concerts"],livingHead:"Living in Wernigerode",livingBody1:"Wernigerode strikes the perfect balance between small-town charm and student convenience. With a population of around 33,000, it's large enough to have everything you need, yet small enough to feel like home.",livingBody2:"Public transport connects you easily to larger cities like Magdeburg and Hannover, making weekend trips a breeze. Meanwhile, the
